<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Заказ такси</title>
  <!-- Подключение официального скрипта Telegram Web App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #ffffff);
      --secondary-bg-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
      --text-color: var(--tg-theme-text-color, #000000);
      --hint-color: var(--tg-theme-hint-color, #8e8e93);
      --button-color: var(--tg-theme-button-color, #2481cc);
      --button-text-color: var(--tg-theme-button-text-color, #ffffff);
      --border-radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 18px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--hint-color);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    input[type="text"],
    input[type="time"],
    textarea {
      width: 100%;
      padding: 12px 14px;
      font-size: 16px;
      color: var(--text-color);
      background-color: var(--secondary-bg-color);
      border: 1px solid transparent;
      border-radius: var(--border-radius);
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus,
    textarea:focus {
      border-color: var(--button-color);
    }

    textarea {
      resize: vertical;
      min-height: 70px;
    }

    /* Переключатели (Когда подать / Класс авто) */
    .segment-group {
      display: flex;
      gap: 8px;
    }

    .segment-btn {
      flex: 1;
      padding: 10px 8px;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      color: var(--text-color);
      background-color: var(--secondary-bg-color);
      border: 2px solid transparent;
      border-radius: var(--border-radius);
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
    }

    .segment-btn.active {
      border-color: var(--button-color);
      background-color: var(--bg-color);
      color: var(--button-color);
    }

    .time-picker-wrapper {
      margin-top: 10px;
      display: none;
    }

    .time-picker-wrapper.visible {
      display: block;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      font-size: 16px;
      font-weight: 600;
      color: var(--button-text-color);
      background-color: var(--button-color);
      border: none;
      border-radius: var(--border-radius);
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error-msg {
      color: #e53935;
      font-size: 14px;
      margin-top: 8px;
      text-align: center;
      display: none;
    }

    /* Экран успешного заказа */
    .success-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      height: 80vh;
    }

    .success-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background-color: var(--button-color);
      color: var(--button-text-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 16px;
    }

    .success-screen h2 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .success-screen p {
      font-size: 14px;
      color: var(--hint-color);
    }
  </style>
</head>
<body>

  <!-- Форма заказа -->
  <div class="container" id="form-screen">
    <h1>Заказ такси</h1>

    <div class="form-group">
      <label for="from">Откуда</label>
      <input type="text" id="from" placeholder="Улица, дом или ориентир" required />
    </div>

    <div class="form-group">
      <label for="to">Куда</label>
      <input type="text" id="to" placeholder="Адрес назначения" required />
    </div>

    <div class="form-group">
      <label>Когда подать</label>
      <div class="segment-group" id="time-mode">
        <div class="segment-btn active" data-value="Сейчас">Сейчас</div>
        <div class="segment-btn" data-value="Ко времени">Ко времени</div>
      </div>
      <div class="time-picker-wrapper" id="time-picker-wrapper">
        <input type="time" id="custom-time" />
      </div>
    </div>

    <div class="form-group">
      <label>Класс авто</label>
      <div class="segment-group" id="car-class">
        <div class="segment-btn active" data-value="Эконом">Эконом</div>
        <div class="segment-btn" data-value="Комфорт">Комфорт</div>
        <div class="segment-btn" data-value="Минивэн">Минивэн</div>
      </div>
    </div>

    <div class="form-group">
      <label for="comment">Комментарий / номер телефона</label>
      <textarea id="comment" placeholder="Подъезд, номер телефона или пожелания"></textarea>
    </div>

    <button class="submit-btn" id="submit-btn">Заказать такси</button>
    <div class="error-msg" id="error-msg"></div>
  </div>

  <!-- Экран подтверждения -->
  <div class="container success-screen" id="success-screen">
    <div class="success-icon">✓</div>
    <h2>Заказ принят, скоро свяжусь</h2>
    <p>Окно закроется автоматически...</p>
  </div>

  <script>
    // ==========================================
    // НАСТРОЙКИ БОТА (Замените на свои данные)
    // ==========================================
    const BOT_TOKEN = 'ВСТАВЬТЕ_СЮДА_ВАШ_BOT_TOKEN';
    const CHAT_ID = 'ВСТАВЬТЕ_СЮДА_ВАШ_CHAT_ID';

    // Инициализация Telegram WebApp
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // Логика выбора времени подачи
    let selectedTimeMode = 'Сейчас';
    const timeModeButtons = document.querySelectorAll('#time-mode .segment-btn');
    const timePickerWrapper = document.getElementById('time-picker-wrapper');
    const customTimeInput = document.getElementById('custom-time');

    timeModeButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        timeModeButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedTimeMode = btn.dataset.value;

        if (selectedTimeMode === 'Ко времени') {
          timePickerWrapper.classList.add('visible');
        } else {
          timePickerWrapper.classList.remove('visible');
        }
      });
    });

    // Логика выбора класса авто
    let selectedCarClass = 'Эконом';
    const carClassButtons = document.querySelectorAll('#car-class .segment-btn');

    carClassButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        carClassButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedCarClass = btn.dataset.value;
      });
    });

    // Отправка заказа
    const submitBtn = document.getElementById('submit-btn');
    const errorMsg = document.getElementById('error-msg');
    const formScreen = document.getElementById('form-screen');
    const successScreen = document.getElementById('success-screen');

    function showError(text) {
      errorMsg.textContent = text;
      errorMsg.style.display = 'block';
    }

    submitBtn.addEventListener('click', async () => {
      errorMsg.style.display = 'none';

      const from = document.getElementById('from').value.trim();
      const to = document.getElementById('to').value.trim();
      const comment = document.getElementById('comment').value.trim() || 'Не указан';
      const customTime = customTimeInput.value;

      if (!from || !to) {
        showError('Пожалуйста, заполните поля «Откуда» и «Куда».');
        return;
      }

      if (selectedTimeMode === 'Ко времени' && !customTime) {
        showError('Пожалуйста, выберите время подачи.');
        return;
      }

      const whenText = selectedTimeMode === 'Сейчас' ? 'Сейчас' : `Ко времени (${customTime})`;

      // Получаем данные пользователя из Telegram WebApp
      const user = tg.initDataUnsafe?.user;
      const firstName = user?.first_name || 'Неизвестно';
      const lastName = user?.last_name ? ` ${user.last_name}` : '';
      const username = user?.username ? `@${user.username}` : 'отсутствует';
      const userId = user?.id || 'неизвестен';

      // Формируем текст сообщения
      const messageText = 
`🚖 <b>Новый заказ такси!</b>

📍 <b>Откуда:</b> ${escapeHtml(from)}
🏁 <b>Куда:</b> ${escapeHtml(to)}
🕒 <b>Когда подать:</b> ${escapeHtml(whenText)}
🚘 <b>Класс авто:</b> ${escapeHtml(selectedCarClass)}
💬 <b>Комментарий / тел.:</b> ${escapeHtml(comment)}

👤 <b>Клиент:</b> ${escapeHtml(firstName + lastName)} (${username}, ID: <code>${userId}</code>)`;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Отправка...';

      try {
        const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            chat_id: CHAT_ID,
            text: messageText,
            parse_mode: 'HTML'
          })
        });

        const data = await response.json();

        if (data.ok) {
          // Вибрация успеха (если поддерживается клиентом Telegram)
          if (tg.HapticFeedback) {
            tg.HapticFeedback.notificationOccurred('success');
          }

          // Переключаем экран
          formScreen.style.display = 'none';
          successScreen.style.display = 'flex';

          // Закрываем Mini App через 2 секунды, чтобы пользователь успел прочитать статус
          setTimeout(() => {
            tg.close();
          }, 2000);
        } else {
          throw new Error(data.description || 'Ошибка Telegram API');
        }
      } catch (err) {
        showError(`Ошибка отправки: ${err.message}`);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Заказать такси';
      }
    });

    // Экранирование HTML-символов во избежание поломок разметки Telegram
    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }
  </script>
</body>
</html>
