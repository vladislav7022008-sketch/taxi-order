<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Заказ такси</title>
<script src="https://telegram.org"></script>
<style>
  body {
    background: var(--tg-theme-bg-color, #17212b);
    color: var(--tg-theme-text-color, #ffffff);
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    padding: 20px 16px;
    margin: 0;
  }
  h1 { text-align: center; font-size: 22px; margin: 0 0 22px; }
  .group { margin-bottom: 16px; }
  label { display: block; font-size: 12px; color: var(--tg-theme-hint-color, #708499); margin-bottom: 6px; text-transform: uppercase; font-weight: 600; }
  input, textarea {
    width: 100%; box-sizing: border-box;
    background: var(--tg-theme-secondary-bg-color, #242f3d);
    color: var(--tg-theme-text-color, #ffffff);
    border: 1px solid transparent; border-radius: 12px;
    padding: 13px; font-size: 16px; outline: none;
  }
  input:focus, textarea:focus { border-color: #5288c1; }
  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .opt {
    background: var(--tg-theme-secondary-bg-color, #242f3d);
    border: 1.5px solid transparent; border-radius: 12px;
    padding: 12px 6px; text-align: center; font-size: 14px; cursor: pointer;
  }
  .opt.active { border-color: #5288c1; background: rgba(82, 136, 193, 0.2); font-weight: 600; }
  .btn {
    width: 100%; background: var(--tg-theme-button-color, #5288c1);
    color: var(--tg-theme-button-text-color, #ffffff);
    border: none; border-radius: 12px; padding: 16px;
    font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 8px;
  }
  .btn:disabled { opacity: 0.6; }
  #err { color: #ff595a; font-size: 13px; text-align: center; margin-top: 10px; display: none; }
  #ok { display: none; text-align: center; padding-top: 25vh; }
  .check {
    width: 64px; height: 64px; border-radius: 50%; background: #2ea043;
    color: #fff; font-size: 32px; line-height: 64px; margin: 0 auto 16px;
  }
  .chat-btn {
    display: inline-block; margin-top: 16px; padding: 12px 22px;
    background: #5288c1; color: #fff; text-decoration: none; border-radius: 12px; font-weight: 600;
  }
</style>
</head>
<body>

<div id="form">
  <h1>Заказ такси</h1>

  <div class="group">
    <label>Откуда</label>
    <input type="text" id="from" placeholder="Улица, дом, подъезд">
  </div>

  <div class="group">
    <label>Куда</label>
    <input type="text" id="to" placeholder="Адрес назначения">
  </div>

  <div class="group">
    <label>Когда подать</label>
    <div class="row-2" id="when-box">
      <div class="opt active" onclick="pickWhen(this, 'Сейчас')">Сейчас</div>
      <div class="opt" onclick="pickWhen(this, 'Ко времени')">Ко времени</div>
    </div>
    <input type="time" id="time" style="display:none; margin-top:8px;">
  </div>

  <div class="group">
    <label>Класс авто</label>
    <div class="row-3" id="class-box">
      <div class="opt" onclick="pickClass(this, 'Эконом')">Эконом</div>
      <div class="opt active" onclick="pickClass(this, 'Комфорт')">Комфорт</div>
      <div class="opt" onclick="pickClass(this, 'Минивэн')">Минивэн</div>
    </div>
  </div>

  <div class="group">
    <label>Комментарий / номер телефона</label>
    <textarea id="comment" rows="2" placeholder="Телефон, детское кресло..."></textarea>
  </div>

  <button class="btn" id="send-btn" onclick="sendOrder()">Заказать такси</button>
  <div id="err"></div>
</div>

<div id="ok">
  <div class="check">✓</div>
  <h2>Заказ принят, скоро свяжусь</h2>
  <p style="color:#708499">Окно закроется автоматически...</p>
  <a class="chat-btn" href="tg://resolve?domain=lomer1sl">Написать водителю (@lomer1sl)</a>
</div>

<script>
  const TOKEN = "9288714982:AAHy5QYwjh_aP57wLJUw4vnjWJPiEcY0lk8";
  const CHAT = "8883475914";
  let whenVal = "Сейчас";
  let classVal = "Комфорт";

  const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  if (tg) { tg.ready(); tg.expand(); }

  function pickWhen(el, val) {
    document.querySelectorAll('#when-box .opt').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    whenVal = val;
    document.getElementById('time').style.display = (val === 'Ко времени') ? 'block' : 'none';
  }

  function pickClass(el, val) {
    document.querySelectorAll('#class-box .opt').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    classVal = val;
  }

  function sendOrder() {
    const from = document.getElementById('from').value.trim();
    const to = document.getElementById('to').value.trim();
    const time = document.getElementById('time').value.trim();
    const comment = document.getElementById('comment').value.trim();
    const err = document.getElementById('err');
    const btn = document.getElementById('send-btn');

    if (!from || !to) {
      err.textContent = "Заполните поля «Откуда» и «Куда»";
      err.style.display = "block";
      return;
    }

    err.style.display = "none";
    btn.disabled = true;
    btn.textContent = "Отправка...";

    let client = "Через браузер";
    if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
      const u = tg.initDataUnsafe.user;
      client = `${u.first_name || ""} ${u.last_name || ""} (${u.username ? "@" + u.username : "ID:" + u.id})`.trim();
    }

    const podacha = (whenVal === 'Ко времени' && time) ? `Ко времени (${time})` : whenVal;
    const msg = `🚖 НОВЫЙ ЗАКАЗ ТАКСИ\n\n📍 Откуда: ${from}\n🏁 Куда: ${to}\n⏰ Подача: ${podacha}\n🚘 Класс: ${classVal}\n💬 Инфо: ${comment || "—"}\n👤 Клиент: ${client}`;

    fetch(`https://telegram.org{TOKEN}/sendMessage`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ chat_id: CHAT, text: msg })
    })
    .then(r => r.json())
    .then(res => {
      if (res.ok) {
        document.getElementById('form').style.display = 'none';
        document.getElementById('ok').style.display = 'block';
        setTimeout(() => { if (tg) tg.close(); }, 2500);
      } else {
        btn.disabled = false;
        btn.textContent = "Заказать такси";
        err.textContent = "Ошибка: " + res.description;
        err.style.display = "block";
      }
    })
    .catch(e => {
      btn.disabled = false;
      btn.textContent = "Заказать такси";
      err.textContent = "Ошибка сети: " + e.message;
      err.style.display = "block";
    });
  }
</script>
</body>
</html>
