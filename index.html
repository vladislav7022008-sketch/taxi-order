<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Оформление заказа</title>
  <script src="https://telegram.org"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: radial-gradient(circle at top, #1f1b38 0%, #0d0b1a 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: rgba(28, 25, 48, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #8e8aa8;
      margin-bottom: 24px;
      letter-spacing: 1px;
    }
    .brand {
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 3px;
    }
    .product {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 24px;
    }
    .product-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .icon-box {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, #3b336b, #231e42);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }
    .product-title {
      font-size: 16px;
      font-weight: 600;
    }
    .product-sub {
      font-size: 12px;
      color: #8e8aa8;
      margin-top: 2px;
    }
    .price {
      font-size: 17px;
      font-weight: 700;
    }
    .pay-btn {
      width: 100%;
      background: linear-gradient(90deg, #9d8df1 0%, #c4b5fd 50%, #9d8df1 100%);
      color: #131026;
      border: none;
      border-radius: 16px;
      padding: 18px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
    }
    .pay-btn:active {
      transform: scale(0.98);
    }
    .pay-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .status {
      text-align: center;
      font-size: 13px;
      margin-top: 14px;
      color: #ff6b6b;
    }
    .status.ok {
      color: #4ade80;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <span class="brand">CLARA</span>
      <span>Оформление заказа</span>
    </div>

    <div class="product">
      <div class="product-left">
        <div class="icon-box">🎧</div>
        <div>
          <div class="product-title">Aura One</div>
          <div class="product-sub">наушники • устройство</div>
        </div>
      </div>
      <div class="price">45 000 ₸</div>
    </div>

    <button class="pay-btn" id="pay-btn">Оплатить 45 000 ₸</button>
    <div class="status" id="status"></div>
  </div>

  <script>
    // HTTPS-адрес вашего сервера, где запущен bot.py
    const SERVER_URL = "https://ВАШ_ДОМЕН_СЕРВЕРА/create-invoice";

    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const btn = document.getElementById("pay-btn");
    const statusEl = document.getElementById("status");

    btn.addEventListener("click", async () => {
      if (!tg || !tg.openInvoice) {
        statusEl.textContent = "Откройте страницу внутри Telegram";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Создание счёта...";
      statusEl.textContent = "";

      try {
        const res = await fetch(SERVER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            title: "Aura One",
            description: "Наушники • устройство",
            amount: 45000
          })
        });

        const data = await res.json();
        if (!data.ok || !data.invoice_link) {
          throw new Error(data.error || "Ошибка создания счёта");
        }

        tg.openInvoice(data.invoice_link, (status) => {
          btn.disabled = false;
          btn.textContent = "Оплатить 45 000 ₸";

          if (status === "paid") {
            statusEl.className = "status ok";
            statusEl.textContent = "Оплата прошла успешно!";
            setTimeout(() => tg.close(), 2000);
          } else if (status === "cancelled") {
            statusEl.className = "status";
            statusEl.textContent = "Оплата отменена";
          } else {
            statusEl.className = "status";
            statusEl.textContent = "Не удалось провести платёж";
          }
        });
      } catch (err) {
        btn.disabled = false;
        btn.textContent = "Оплатить 45 000 ₸";
        statusEl.className = "status";
        statusEl.textContent = "Ошибка: " + err.message;
      }
    });
  </script>
</body>
</html>
