<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Заказ такси</title>
  <script src="https://telegram.org"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #17212b);
      --secondary-bg-color: var(--tg-theme-secondary-bg-color, #242f3d);
      --text-color: var(--tg-theme-text-color, #ffffff);
      --hint-color: var(--tg-theme-hint-color, #708499);
      --button-color: var(--tg-theme-button-color, #5288c1);
      --button-text-color: var(--tg-theme-button-text-color, #ffffff);
      --border-radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px 16px 32px;
      min-height: 100vh;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--hint-color);
      margin-bottom: 8px;
    }

    input[type="text"],
    input[type="time"],
    textarea {
      width: 100%;
      background-color: var(--secondary-bg-color);
      border: 1px solid transparent;
      border-radius: var(--border-radius);
      padding: 14px;
      color: var(--text-color);
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus,
    textarea:focus {
      border-color: var(--button-color);
    }

    textarea {
      resize: vertical;
      min-height: 84px;
    }

    .segmented-control {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .class-control {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .option-btn {
      background-color: var(--secondary-bg-color);
      color: var(--text-color);
      border: 1.5px solid transparent;
      border-radius: var(--border-radius);
      padding: 12px 8px;
      font-size: 14px;
      font-weight: 500;
      text-align: center;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s;
    }

    .option-btn.active {
      border-color: var(--button-color);
      background-color: rgba(82, 136, 193, 0.18);
      font-weight: 600;
    }

    #time-input-wrapper {
      margin-top: 10px;
      display: none;
    }

    .submit-btn {
      width: 100%;
      background-color: var(--button-color);
      color: var(--button-text-color);
      border: none;
      border-radius: var(--border-radius);
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s;
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error-msg {
      color: #ff595a;
      font-size: 13px;
      text-align: center;
      margin-top: 12px;
      display: none;
    }

    #success-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 75vh;
      padding: 20px;
    }

    .check-circle {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background-color: #2ea043;
      color: #fff;
      font-size: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    #success-screen h2 {
      font-size: 20px;
      margin-bottom: 10px;
    }

    #success-screen p {
      color: var(--hint-color);
      font-size: 15px;
      margin-bottom: 20px;
    }

    .chat-link-btn {
      display: inline-block;
      background-color: var(--button-color);
      color: var(--button-text-color);
      text-decoration: none;
      padding: 12px 24px;
      border-radius: var(--border-radius);
      font-size: 15px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div id="form-screen">
    <h1>Заказ такси</h1>

    <div class="form-group">
      <label for="from">Откуда</label>
      <input type="text" id="from" placeholder="Улица, дом, подъезд" required />
    </div>

    <div class="form-group">
      <label for="to">Куда</label>
      <input type="text" id="to" placeholder="Адрес назначения" required />
    </div>

    <div class="form-group">
      <label>Когда подать</label>
      <div class="segmented-control" id="when-group">
        <div class="option-btn active" data-value="Сейчас">Сейчас</div>
        <div class="option-btn" data-value="Ко времени">Ко времени</div>
      </div>
      <div id="time-input-wrapper">
        <input type="time" id="exact-time" />
      </div>
    </div>

    <div class="form-group">
      <label>Класс авто</label>
      <div class="class-control" id="class-group">
        <div class="option-btn" data-value="Эконом">Эконом</div>
        <div class="option-btn active" data-value="Комфорт">Комфорт</div>
        <div class="option-btn" data-value="Минивэн">Минивэн</div>
      </div>
    </div>

    <div class="form-group">
      <label for="comment">Комментарий / номер телефона</label>
      <textarea id="comment" placeholder="Номер телефона, детское кресло, багаж..."></textarea>
    </div>

    <button class="submit-btn" id="submit-btn">Заказать такси</button>
    <div class="error-msg" id="error-msg">Заполните поля «Откуда» и «Куда»</div>
  </div>

  <div id="success-screen">
    <div class="check-circle">✓</div>
    <h2>Заказ принят, скоро свяжусь</h2>
    <p>Окно закроется автоматически...</p>
    <a class="chat-link-btn" id="driver-btn" href="tg://resolve?domain=lomer1sl">Написать водителю (@lomer1sl)</a>
  </div>

  <script>
    const BOT_TOKEN = "9288714982:AAHy5QYwjh_aP57wLJUw4vnjWJPiEcY0lk8";
    const CHAT_ID = "8883475914";
    const DRIVER_USERNAME = "lomer1sl";

    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    let selectedWhen = "Сейчас";
    let selectedClass = "Комфорт";

    document.querySelectorAll("#when-group .option-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#when-group .option-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        selectedWhen = btn.dataset.value;
        document.getElementById("time-input-wrapper").style.display = selectedWhen === "Ко времени" ? "block" : "none";
      });
    });

    document.querySelectorAll("#class-group .option-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#class-group .option-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        selectedClass = btn.dataset.value;
      });
    });

    document.getElementById("driver-btn").addEventListener("click", (e) => {
      if (tg && tg.openTelegramLink) {
        e.preventDefault();
        tg.openTelegramLink(`https://t.me{DRIVER_USERNAME}`);
        setTimeout(() => tg.close(), 300);
      }
    });

    document.getElementById("submit-btn").addEventListener("click", () => {
      const fromVal = document.getElementById("from").value.trim();
      const toVal = document.getElementById("to").value.trim();
      const exactTime = document.getElementById("exact-time").value.trim();
      const commentVal = document.getElementById("comment").value.trim();
      const errorMsg = document.getElementById("error-msg");
      const submitBtn = document.getElementById("submit-btn");

      if (!fromVal || !toVal) {
        errorMsg.textContent = "Пожалуйста, заполните поля «Откуда» и «Куда»";
        errorMsg.style.display = "block";
        return;
      }

      errorMsg.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.textContent = "Отправка заказа...";

      const whenText = (selectedWhen === "Ко времени" && exactTime) ? `Ко времени (${exactTime})` : selectedWhen;

      let clientInfo = "Через браузер";
      if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
        const u = tg.initDataUnsafe.user;
        const fullName = [u.first_name, u.last_name].filter(Boolean).join(" ");
        const username = u.username ? `@${u.username}` : "без юзернейма";
        clientInfo = `${fullName} (${username}, ID: ${u.id})`;
      }

      const text =
        `🚖 НОВЫЙ ЗАКАЗ ТАКСИ\n\n` +
        `📍 Откуда: ${fromVal}\n` +
        `🏁 Куда: ${toVal}\n` +
        `⏰ Подача: ${whenText}\n` +
        `🚘 Класс: ${selectedClass}\n` +
        `💬 Комментарий / тел.: ${commentVal || "—"}\n` +
        `👤 Клиент: ${clientInfo}`;

      const apiUrl = `https://telegram.org{BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(text)}`;

      let iframe = document.getElementById("tg-hidden-frame");
      if (!iframe) {
        iframe = document.createElement("iframe");
        iframe.id = "tg-hidden-frame";
        iframe.name = "tg-hidden-frame";
        iframe.style.display = "none";
        document.body.appendChild(iframe);
      }
      iframe.src = apiUrl;

      setTimeout(() => {
        document.getElementById("form-screen").style.display = "none";
        document.getElementById("success-screen").style.display = "flex";
        setTimeout(() => {
          if (tg) tg.close();
        }, 2500);
      }, 600);
    });
  </script>
</body>
</html>
