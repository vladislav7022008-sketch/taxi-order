<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Оплата в Telegram</title>
  <script src="https://telegram.org"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #17212b);
      --sec-bg: var(--tg-theme-secondary-bg-color, #242f3d);
      --text: var(--tg-theme-text-color, #ffffff);
      --hint: var(--tg-theme-hint-color, #708499);
      --btn: var(--tg-theme-button-color, #5288c1);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding: 24px 16px;
      min-height: 100vh;
    }

    h1 {
      font-size: 22px;
      text-align: center;
      margin-bottom: 24px;
    }

    .card {
      background: var(--sec-bg);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 20px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .row:last-child {
      border-bottom: none;
    }

    .label {
      color: var(--hint);
      font-size: 14px;
    }

    .value {
      font-size: 16px;
      font-weight: 600;
    }

    .pay-btn {
      width: 100%;
      background: var(--btn);
      color: var(--btn-text);
      border: none;
      border-radius: 12px;
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .pay-btn:disabled {
      opacity: 0.6;
    }

    #status {
      text-align: center;
      margin-top: 16px;
      font-size: 14px;
      color: #ff595a;
    }

    #success-box {
      display: none;
      text-align: center;
      padding-top: 22vh;
    }

    .check {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #2ea043;
      color: #fff;
      font-size: 32px;
      line-height: 64px;
      margin: 0 auto 16px;
    }
  </style>
</head>
<body>

  <div id="main-box">
    <h1>Оплата заказа</h1>

    <div class="card">
      <div class="row">
        <span class="label">Услуга</span>
        <span class="value">Оплата заказа</span>
      </div>
      <div class="row">
        <span class="label">Способ оплаты</span>
        <span class="value">Банковская карта</span>
      </div>
      <div class="row">
        <span class="label">Итого к оплате</span>
        <span class="value">500.00 RUB</span>
      </div>
    </div>

    <button class="pay-btn" id="pay-btn">Оплатить картой</button>
    <div id="status"></div>
  </div>

  <div id="success-box">
    <div class="check">✓</div>
    <h2>Оплата прошла успешно!</h2>
    <p style="color: var(--hint); margin-top: 8px;">Окно закроется автоматически...</p>
  </div>

  <script>
    // Вставьте сюда ссылку вида https://t.me... полученную на Шаге 1
    const INVOICE_LINK = "https://t.meВАША_ССЫЛКА_НА_СЧЕТ";

    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const payBtn = document.getElementById("pay-btn");
    const statusEl = document.getElementById("status");

    payBtn.addEventListener("click", () => {
      if (!tg || !tg.openInvoice) {
        statusEl.textContent = "Откройте это приложение внутри Telegram";
        return;
      }

      if (INVOICE_LINK.includes("ВАША_ССЫЛКА")) {
        statusEl.textContent = "Не указана ссылка на счёт INVOICE_LINK";
        return;
      }

      payBtn.disabled = true;
      statusEl.textContent = "";

      // Открывает нативное окно оплаты картой прямо внутри Telegram
      tg.openInvoice(INVOICE_LINK, (status) => {
        payBtn.disabled = false;

        if (status === "paid") {
          document.getElementById("main-box").style.display = "none";
          document.getElementById("success-box").style.display = "block";
          setTimeout(() => tg.close(), 2500);
        } else if (status === "cancelled") {
          statusEl.textContent = "Оплата отменена";
        } else if (status === "failed") {
          statusEl.textContent = "Ошибка оплаты. Проверьте данные карты.";
        }
      });
    });
  </script>
</body>
</html>
